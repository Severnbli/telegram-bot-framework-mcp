[project]
name = "telegram-bot-framework-mcp"
version = "0.1.0"
description = "MCP server exposing docs, examples and source of MajMcCloud/TelegramBotFramework (TelegramBotBase, .NET)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2"]

[project.scripts]
telegram-bot-framework-mcp = "telegram_bot_framework_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_bot_framework_mcp"]
