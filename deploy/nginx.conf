# /etc/nginx/sites-available/tgbotbase-mcp  (symlink into sites-enabled)
# The map/limit_*/set_real_ip_from lines must live in the http context (sites-enabled files are included there).

# Access mode. Public by default. To require a bearer token instead, change `default 1;` to `default 0;`
# and uncomment the "Bearer ..." line with your own secret (openssl rand -hex 32), then reload nginx.
map $http_authorization $tgbotbase_authorized {
    default                     1;
    # "Bearer CHANGE_ME_TOKEN"  1;
}

# Cloudflare proxy: restore the real client IP so rate limits apply per visitor, not per Cloudflare edge node.
# Only trust CF-Connecting-IP when the request really comes from a Cloudflare range (list: https://www.cloudflare.com/ips/,
# re-check it from time to time). Requires ngx_http_realip_module (built into the stock Debian/Ubuntu nginx).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Abuse protection (per client IP)
limit_req_zone  $binary_remote_addr zone=tbf_mcp_req:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=tbf_mcp_conn:10m;

server {
    listen 80;
    server_name tbf-mcp.severnbli.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tbf-mcp.severnbli.dev;

    ssl_certificate     /etc/letsencrypt/live/tbf-mcp.severnbli.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tbf-mcp.severnbli.dev/privkey.pem;

    location /mcp {
        if ($tgbotbase_authorized = 0) { return 401; }

        limit_req  zone=tbf_mcp_req burst=20 nodelay;
        limit_conn tbf_mcp_conn 10;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # MCP streams responses (SSE): no buffering, long timeouts
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / { return 404; }
}
