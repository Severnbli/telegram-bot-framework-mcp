# /etc/nginx/sites-available/tgbotbase-mcp  (symlink into sites-enabled)
# The map/limit_* lines must live in the http context (sites-enabled files are included there).

# Access mode. Public by default. To require a bearer token instead, change `default 1;` to `default 0;`
# and uncomment the "Bearer ..." line with your own secret (openssl rand -hex 32), then reload nginx.
map $http_authorization $tgbotbase_authorized {
    default                     1;
    # "Bearer CHANGE_ME_TOKEN"  1;
}

# Abuse protection (per client IP)
limit_req_zone  $binary_remote_addr zone=tbf_mcp_req:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=tbf_mcp_conn:10m;

server {
    listen 80;
    server_name tbf-mcp.severnbli.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tbf-mcp.severnbli.dev;

    ssl_certificate     /etc/letsencrypt/live/tbf-mcp.severnbli.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tbf-mcp.severnbli.dev/privkey.pem;

    location /mcp {
        if ($tgbotbase_authorized = 0) { return 401; }

        limit_req  zone=tbf_mcp_req burst=20 nodelay;
        limit_conn tbf_mcp_conn 10;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # MCP streams responses (SSE): no buffering, long timeouts
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / { return 404; }
}
