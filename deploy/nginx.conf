# /etc/nginx/sites-available/tgbotbase-mcp  (symlink into sites-enabled)
# Replace mcp.example.com and the token. Generate a token: openssl rand -hex 32
# The `map` block must live in the http context (sites-enabled files are included there).

map $http_authorization $tgbotbase_authorized {
    default                     0;
    "Bearer CHANGE_ME_TOKEN"    1;
}

server {
    listen 80;
    server_name mcp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mcp.example.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;

    location /mcp {
        if ($tgbotbase_authorized = 0) { return 401; }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # MCP streams responses (SSE): no buffering, long timeouts
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / { return 404; }
}
